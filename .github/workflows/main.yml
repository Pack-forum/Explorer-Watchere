
name: ExplorerWatcher CE Diagnostic Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/enlyze/windows-ce-build-environment-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check compiler and libraries
        shell: bash
        run: |
          set -eu

          echo "=== COMPILER ==="
          arm-mingw32ce-g++ --version

          echo "=== LIBRARY FILES ==="
          find /opt/cegcc-arm/arm-mingw32ce/lib \
            -maxdepth 1 -type f | sort

          echo "=== REQUIRED SYMBOLS ==="
          find /opt/cegcc-arm -type f \
            \( -name '*.a' -o -name '*.dll' \) \
            -exec sh -c '
              for f do
                arm-mingw32ce-nm -A "$f" 2>/dev/null |
                  grep -E "CreateFontW|SetStretchBltMode" || true
              done
            ' sh {} +

      - name: Fix source
        shell: bash
        run: |
          sed -i 's/PtInRect(\([^,]*\), *&p)/PtInRect(\1, p)/g' \
            ExplorerWatcher/src/main.cpp

      - name: Compile test
        shell: bash
        run: |
          arm-mingw32ce-g++ \
            -Os -DUNICODE -D_UNICODE \
            -D_WIN32_WCE=0x500 \
            -c ExplorerWatcher/src/main.cpp \
            -o main.o

          echo "Source compilation successful."

      - name: Upload diagnostic files
        uses: actions/upload-artifact@v4
        with:
          name: ExplorerWatcher-Diagnostics
          path: main.o
          if-no-files-found: error
