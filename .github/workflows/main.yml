
name: ExplorerWatcher CE Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/enlyze/windows-ce-build-environment-arm

    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          arm-mingw32ce-g++ \
            -Os \
            -s \
            -DUNICODE \
            -D_UNICODE \
            ExplorerWatcher/src/main.cpp \
            -o ExplorerWatcher.exe \
            -lgdi32 \
            -luser32

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ExplorerWatcher-EXE
          path: ExplorerWatcher.exe
