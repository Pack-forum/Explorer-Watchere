
name: ExplorerWatcher CE Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/enlyze/windows-ce-build-environment-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Windows CE compatibility
        shell: bash
        run: |
          set -eu
          FILE="ExplorerWatcher/src/main.cpp"

          # CreateFont yerine Windows CE uyumlu CreateFontIndirect kullan
          sed -i '/return CreateFont(/c\  LOGFONT lf = {0};\
          lf.lfHeight = -h;\
          lf.lfWeight = w;\
          lf.lfCharSet = DEFAULT_CHARSET;\
          lstrcpy(lf.lfFaceName, TEXT("Tahoma"));\
          return CreateFontIndirect(&lf);' "$FILE"

          # Windows CE sürümünde desteklenmeyen ayarı kaldır
          sed -i '/SetStretchBltMode[[:space:]]*(/d' "$FILE"

          # PtInRect parametrelerini düzelt
          sed -i 's/PtInRect(\([^,]*\), *&p)/PtInRect(\1, p)/g' "$FILE"

          echo "Compatibility fixes applied."

      - name: Compile and link EXE
        shell: bash
        run: |
          set -eu

          arm-mingw32ce-g++ \
            -Os \
            -s \
            -DUNICODE \
            -D_UNICODE \
            -D_WIN32_WCE=0x500 \
            ExplorerWatcher/src/main.cpp \
            -o ExplorerWatcher.exe \
            -lcoredll

          test -s ExplorerWatcher.exe
          file ExplorerWatcher.exe
          ls -lh ExplorerWatcher.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ExplorerWatcher-WindowsCE-ARM
          path: ExplorerWatcher.exe
          if-no-files-found: error
